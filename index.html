<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Next Stop shows every bus arriving near you on a calm 3D map of Singapore. This demo drives simulated buses on real routes.">
<meta name="theme-color" content="#f3f1ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#11161d" media="(prefers-color-scheme: dark)">
<title>Next Stop – Singapore bus arrivals</title>
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.css">
<link rel="stylesheet" href="demo.css">
</head>
<body>
<div id="map"></div>
<div id="shade" aria-hidden="true"></div>
<div id="haze" aria-hidden="true"></div>
<canvas id="weather" aria-hidden="true"></canvas>

<aside class="tray" aria-label="A bus stop in Singapore">
  <div class="grabber" aria-hidden="true"></div>
  <div class="tray-head">
    <div id="stop" class="stop"><b></b><span><code></code> <i></i></span></div>
    <button id="find" type="button" aria-label="Search for a bus stop" title="Search bus stops" aria-expanded="false" aria-controls="search">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="m15.5 15.5 5 5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
    </button>
    <button id="locate" type="button" aria-label="Show the bus stop nearest to me" title="Nearest bus stop">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M20.5 3.5 3.8 10.4c-.8.3-.7 1.5.1 1.7l6.6 1.4 1.4 6.6c.2.8 1.4.9 1.7.1z" fill="currentColor"/></svg>
    </button>
    <button id="shuffle" type="button" aria-label="Show another bus stop" title="Another bus stop">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M3 7h3.5c2 0 3.2.9 4.3 2.6l2.4 4.8c1.1 1.7 2.3 2.6 4.3 2.6H21M3 17h3.5c2 0 3.2-.9 4.3-2.6M13.2 9.6c1.1-1.7 2.3-2.6 4.3-2.6H21M18 4l3 3-3 3M18 14l3 3-3 3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>
  <div id="search" class="search" hidden>
    <input id="search-input" type="search" placeholder="Stop name, code or road" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="search" aria-label="Search bus stops" aria-controls="search-results">
    <ul id="search-results" aria-label="Matching bus stops"></ul>
  </div>
  <div class="timeline">
    <div class="track"><span class="now"></span><div id="plates"></div></div>
    <div class="ticks" aria-hidden="true"><span>Now</span><span style="--at: 0.5">5</span><span style="--at: 0.7071">10</span><span style="--at: 0.866">15</span><span>20m</span></div>
  </div>
  <div class="cta">
    <ul class="themes" aria-label="Map styles in the app">
      <li><button type="button" data-style="classic" aria-pressed="true"><img src="images/themes/classic.jpg" alt="" width="144" height="81"><span>Classic</span></button></li>
      <li><button type="button" data-style="monochrome" aria-pressed="false"><img src="images/themes/monochrome.jpg" alt="" width="144" height="81"><span>Monochrome</span></button></li>
      <li><button type="button" data-style="dithered" aria-pressed="false"><img src="images/themes/dithered.jpg" alt="" width="144" height="81"><span>Dithered</span></button></li>
      <li><button type="button" data-style="muffin" aria-pressed="false"><img src="images/themes/muffin.jpg" alt="" width="144" height="81"><span>Muffin</span></button></li>
    </ul>
    <p id="style-note" class="style-note" hidden></p>
    <a class="download" href="https://apps.apple.com/sg/app/nextstop-singapore/id1487419506" rel="noopener"><img src="https://developer.apple.com/assets/elements/badges/download-on-the-app-store.svg" alt="Download on the App Store" width="150" height="50"></a>
    <a class="how" href="interpolation.html">How bus interpolation works</a>
  </div>
  <p class="credit"><a href="https://x.com/nsjunxiu" rel="noopener">made by @nsjunxiu</a><span aria-hidden="true">·</span><a href="support/">Support</a><span aria-hidden="true">·</span><a href="privacy.html">Privacy</a></p>
</aside>

<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
<script src="muffin.js"></script>
<script src="demo.js"></script>
<script src="map-styles.js"></script>
</body>
</html>
