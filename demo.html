<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Next Stop shows every bus arriving near you on a calm 3D map of Singapore. This demo drives simulated buses on real routes.">
<meta name="theme-color" content="#f3f1ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#11161d" media="(prefers-color-scheme: dark)">
<title>Next Stop – Singapore bus arrivals</title>
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.css">
<link rel="stylesheet" href="demo.css">
</head>
<body>
<div id="map"></div>
<div id="shade" aria-hidden="true"></div>
<div id="haze" aria-hidden="true"></div>
<canvas id="weather" aria-hidden="true"></canvas>

<aside class="sheet" aria-label="Bus stop preview">
  <div class="brand">
    <img src="icon.png" alt="" width="40" height="40">
    <div class="title">
      <h1>Next Stop</h1>
      <p><span id="place">Singapore</span> · <span id="sky"></span> · simulated buses</p>
    </div>
    <button id="shuffle" class="shuffle" type="button" aria-label="Show another bus stop" title="Another stop">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 7h11l-3-3m3 3-3 3M20 17H9l3 3m-3-3 3-3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>
  <div class="scroll">
    <section class="stop-head">
      <h2 id="stop-name"></h2>
      <p><span id="stop-code" class="code"></span><span id="stop-road"></span></p>
    </section>
    <div class="services-head"><h3 id="service-count"></h3><span class="pill">DEMO</span></div>
    <ul id="rows" class="card"></ul>
  </div>
  <footer class="cta">
    <p>To see more, download the app.</p>
    <a class="download" href="#" data-download>
      <img src="icon.png" alt="" width="34" height="34">
      <span><small>Download on the</small>App Store</span>
    </a>
    <nav class="links"><a href="index.html">Support</a><a href="privacy.html">Privacy</a></nav>
  </footer>
</aside>

<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
<script src="demo.js"></script>
</body>
</html>
