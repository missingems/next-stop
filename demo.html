<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Next Stop shows every bus arriving near you on a calm 3D map of Singapore. This demo drives simulated buses on real routes.">
<meta name="theme-color" content="#f3f1ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#11161d" media="(prefers-color-scheme: dark)">
<title>Next Stop – Singapore bus arrivals</title>
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.css">
<link rel="stylesheet" href="demo.css">
</head>
<body>
<div id="map"></div>
<div id="shade" aria-hidden="true"></div>
<div id="haze" aria-hidden="true"></div>
<canvas id="weather" aria-hidden="true"></canvas>

<div class="controls">
  <div class="column glass">
    <button id="weather-button" type="button" aria-label="Change the weather" title="Weather">
      <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path fill="currentColor" d="M12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7Zm7.43-2.53c.04-.32.07-.64.07-.97s-.03-.66-.07-.98l2.11-1.65a.5.5 0 0 0 .12-.64l-2-3.46a.5.5 0 0 0-.61-.22l-2.49 1a7.3 7.3 0 0 0-1.69-.98l-.38-2.65A.49.49 0 0 0 14 2h-4a.49.49 0 0 0-.49.42l-.38 2.65c-.61.25-1.17.58-1.69.98l-2.49-1a.5.5 0 0 0-.61.22l-2 3.46a.5.5 0 0 0 .12.64L4.57 11c-.04.32-.07.65-.07.98s.03.65.07.97l-2.11 1.66a.5.5 0 0 0-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1c.52.4 1.08.73 1.69.98l.38 2.65c.04.24.25.42.49.42h4c.25 0 .45-.18.49-.42l.38-2.65c.61-.25 1.17-.58 1.69-.98l2.49 1c.22.08.49 0 .61-.22l2-3.46a.5.5 0 0 0-.12-.64l-2.11-1.66Z"/></svg>
    </button>
    <button id="drive" type="button" aria-label="Drive mode" title="Drive mode">
      <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2.2"/><circle cx="12" cy="12" r="2.2" fill="currentColor"/><path d="M3.5 11c3-1.6 5.8-2.2 8.5-2.2s5.5.6 8.5 2.2M10 13.6 7.2 20M14 13.6l2.8 6.4" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
    </button>
  </div>
  <button id="locate" class="round glass" type="button" aria-label="Back to the stop" title="Back to the stop">
    <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path fill="currentColor" d="M20.6 3.4a.9.9 0 0 0-.98-.2L3.7 9.9a.9.9 0 0 0 .1 1.7l6.6 1.9 1.9 6.6a.9.9 0 0 0 1.7.1l6.7-15.9a.9.9 0 0 0-.1-.9Z"/></svg>
  </button>
</div>
<div id="toast" class="glass" role="status" aria-live="polite"></div>

<aside class="sheet" aria-label="Nearby bus stop">
  <div class="grabber" aria-hidden="true"></div>
  <button id="search" class="search" type="button" title="Show another stop">
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="m15.5 15.5 5 5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
    <span>Bus stop or address</span>
  </button>
  <div id="chips" class="chips"></div>
  <div class="scroll">
    <div class="services-head"><h3 id="service-count"></h3><span class="sort">Arrival <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M7 4v16M3.5 7.5 7 4l3.5 3.5M17 20V4m-3.5 12.5L17 20l3.5-3.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span></div>
    <ul id="rows"></ul>
  </div>
  <footer class="cta">
    <img src="icon.png" alt="" width="40" height="40">
    <div class="pitch">
      <b>Next Stop</b>
      <p>To see more, download the app.</p>
      <nav class="links"><a href="index.html">Support</a><a href="privacy.html">Privacy</a><span>Demo data</span></nav>
    </div>
    <a class="download" href="#" data-download><span><small>Download on the</small>App Store</span></a>
  </footer>
</aside>

<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
<script src="demo.js"></script>
</body>
</html>
