<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Next Stop shows every bus arriving near you on a calm 3D map of Singapore. This demo drives simulated buses on real routes.">
<meta name="theme-color" content="#f3f1ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#11161d" media="(prefers-color-scheme: dark)">
<title>Next Stop – Singapore bus arrivals</title>
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.css">
<link rel="stylesheet" href="demo.css">
</head>
<body>
<div id="map"></div>
<div id="shade" aria-hidden="true"></div>
<div id="haze" aria-hidden="true"></div>
<canvas id="weather" aria-hidden="true"></canvas>

<aside class="tray" aria-label="A bus stop in Singapore">
  <div class="grabber" aria-hidden="true"></div>
  <div class="tray-head">
    <div id="stop" class="stop"><b></b><span><code></code> <i></i></span></div>
    <button id="shuffle" type="button" aria-label="Show another bus stop" title="Another bus stop">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M3 7h3.5c2 0 3.2.9 4.3 2.6l2.4 4.8c1.1 1.7 2.3 2.6 4.3 2.6H21M3 17h3.5c2 0 3.2-.9 4.3-2.6M13.2 9.6c1.1-1.7 2.3-2.6 4.3-2.6H21M18 4l3 3-3 3M18 14l3 3-3 3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>
  <div class="timeline">
    <div class="track"><span class="now"></span><div id="plates"></div></div>
    <div class="ticks" aria-hidden="true"><span>Now</span><span style="--at: 0.5">5</span><span style="--at: 0.7071">10</span><span style="--at: 0.866">15</span><span>20m</span></div>
  </div>
  <div class="cta">
    <h2>To view more</h2>
    <a class="download" href="#" data-download><img src="https://developer.apple.com/assets/elements/badges/download-on-the-app-store.svg" alt="Download on the App Store" width="150" height="50"></a>
  </div>
  <p class="credit"><a href="https://x.com/nsjunxiu" rel="noopener">made by @nsjunxiu</a><span aria-hidden="true">·</span><a href="support/">Support</a><span aria-hidden="true">·</span><a href="privacy.html">Privacy</a></p>
</aside>

<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
<script src="demo.js"></script>
</body>
</html>
